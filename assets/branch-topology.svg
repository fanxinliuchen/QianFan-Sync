<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" width="680" height="250" role="img">
<title>双向合流与单向变基的拓扑对比</title>
<desc>左边是双向合流方案：上游和你的分支都向 main 合并，main 成为混合体；右边是单向变基方案：你的分支直接叠在上游之上，随时可以对照。</desc>
<defs>
<marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="250" fill="#FFFFFF"/>

<text x="40" y="46" font-size="13" font-weight="500" fill="#2C2C2A" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">① 双向合流</text>

<text x="40" y="88" font-size="12" fill="#5F5E5A" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">upstream/master</text>
<text x="155" y="74" font-size="11" fill="#5F5E5A" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">官方不会主动提交</text>
<text x="40" y="148" font-size="12" fill="#185FA5" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">dev（你的改动）</text>

<path d="M152 84 L246 106" fill="none" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#a2)"/>
<path d="M148 144 L246 128" fill="none" stroke="#378ADD" stroke-width="1.5" marker-end="url(#a2)"/>

<rect x="250" y="98" width="64" height="38" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="282" y="117" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">main</text>

<text x="40" y="205" font-size="12" fill="#5F5E5A" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">main 成了混合体，和上游永久分叉</text>

<line x1="340" y1="30" x2="340" y2="220" stroke="#D3D1C7" stroke-width="0.5"/>

<text x="380" y="46" font-size="13" font-weight="500" fill="#2C2C2A" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">② 单向变基</text>

<text x="380" y="88" font-size="12" fill="#5F5E5A" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">upstream/master</text>
<path d="M455 96 L455 134" fill="none" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#a2)"/>
<text x="380" y="152" font-size="12" fill="#185FA5" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">dev（上游 + 你的改动）</text>

<text x="380" y="205" font-size="12" fill="#5F5E5A" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">始终能对照上游，冲突只解一次</text>
</svg>
